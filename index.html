<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeVault – your code files, anywhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0e1319;--panel:#151c25;--line:#243040;--text:#e6edf5;--mute:#8393a7;--acc:#5eead4;--acc2:#0e1319;--bad:#ff7a8a;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Manrope,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.hide{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:20px}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px;width:100%;max-width:400px}
.brand{font-weight:800;font-size:28px;letter-spacing:-.5px;margin:0 0 4px}
.brand span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 22px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input[type=text],input[type=password],input[type=search],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:var(--acc2);border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--acc)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.full{width:100%;margin-top:20px}
.switch{text-align:center;color:var(--mute);margin:16px 0 0;font-size:14px}
.switch a{color:var(--acc);cursor:pointer}
.msg{margin-top:14px;font-size:14px;color:var(--bad);min-height:20px}
.msg.ok{color:var(--acc)}
/* app */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:14px 20px;position:sticky;top:0;background:var(--bg);z-index:5}
header .brand{font-size:21px;margin:0;margin-right:auto}
.timer{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--mute)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.who{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;margin:22px 0 18px}
.tab{background:none;border:0;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--mute);font-weight:600}
.tab.on{background:var(--panel);color:var(--text)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--mute);cursor:pointer;transition:.15s}
.drop.over,.drop:hover{border-color:var(--acc);color:var(--text);background:rgba(94,234,212,.05)}
.drop b{color:var(--acc)}
.bar{display:flex;gap:10px;margin:22px 0 12px}
.bar input{flex:1}.bar select{width:auto}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ext{min-width:52px;text-align:center;font-size:12px;font-weight:600;padding:4px 0;border-radius:6px;background:var(--bg);color:var(--acc);border:1px solid var(--line)}
.fn{flex:1;min-width:0}
.fn div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--mute)}
.empty{padding:34px;text-align:center;color:var(--mute)}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.pill.g{color:var(--acc);border-color:var(--acc)}
.pill.r{color:var(--bad);border-color:var(--bad)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);padding:10px 18px;border-radius:10px;z-index:20}
@media(max-width:600px){.row{flex-wrap:wrap}.actions{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN / SIGN UP -->
<section id="auth" class="auth">
  <div class="card">
    <h1 class="brand">Code<span>Vault</span></h1>
    <p class="sub">Store your C, C++ and Python files and open them from any device.</p>
    <label for="u">Username</label>
    <input id="u" type="text" autocomplete="username" autocapitalize="off">
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password">
    <button class="btn full" id="authBtn">Sign in</button>
    <div class="msg" id="authMsg"></div>
    <p class="switch" id="sw">No account? <a id="swLink">Create one</a></p>
  </div>
</section>

<!-- APP -->
<section id="app" class="hide">
  <header>
    <h1 class="brand">Code<span>Vault</span></h1>
    <span class="who" id="who"></span>
    <span class="timer mono" id="timer">4:00</span>
    <button class="btn ghost sm" id="out">Sign out</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <button class="tab on" data-t="files">My files</button>
      <button class="tab" data-t="pub">Public files</button>
      <button class="tab hide" data-t="all" id="tAll">All files</button>
      <button class="tab hide" data-t="users" id="tUsers">Users</button>
    </div>

    <div id="vFiles">
      <div id="upBox">
        <div class="drop" id="drop"><b>Choose files</b> or drop them here<br><span class="meta">.c .cpp .h .py .java .js and anything else</span></div>
        <label style="display:flex;gap:8px;align-items:center;color:var(--text);margin-top:12px;cursor:pointer"><input type="checkbox" id="pubChk"> Make uploaded files public (every approved user can see and download them)</label>
      </div>
      <input type="file" id="pick" multiple class="hide">
      <div class="bar">
        <input type="search" id="q" placeholder="Search files">
        <select id="ext"><option value="">All types</option></select>
      </div>
      <div class="list" id="fileList"></div>
    </div>

    <div id="vUsers" class="hide"><div class="list" id="userList"></div></div>
  </div>
</section>
<div class="toast hide" id="toast"></div>

<script>
/* ====== 1. PUT YOUR SUPABASE DETAILS HERE (see SETUP.md) ====== */
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
/* ================================================================ */

const SESSION_MS = 4 * 60 * 1000;   // auto sign-out after 4 minutes
const DOMAIN = '@codevault.app';
let sb = null, initError = '';
try {
  if (typeof supabase === 'undefined') throw new Error('Could not load the Supabase library. Check your internet connection.');
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  initError = SUPABASE_URL.startsWith('YOUR_')
    ? 'Setup needed: open index.html and replace YOUR_SUPABASE_URL and YOUR_SUPABASE_ANON_KEY (see SETUP.md).'
    : 'Setup error: ' + e.message + ' (check the URL starts with https:// and the key is the anon public key)';
}
window.addEventListener('unhandledrejection', e => { const m = $('authMsg'); if (m) setMsg('Error: ' + (e.reason && e.reason.message || e.reason)); });
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, profile = null, tick = null, mode = 'in', files = [], names = {}, tab = 'files';

function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.add('hide'),2800)}
function setMsg(t,ok){const m=$('authMsg');m.textContent=t||'';m.className='msg'+(ok?' ok':'')}
function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
const extOf = n => (n.includes('.') ? n.split('.').pop() : 'file').toLowerCase().slice(0,6);

/* ---------- auth ---------- */
function showAuth(msg, ok){
  clearInterval(tick); me = profile = null;
  $('app').classList.add('hide'); $('auth').classList.remove('hide'); setMsg(msg, ok);
}
$('swLink').onclick = () => {
  mode = mode === 'in' ? 'up' : 'in';
  $('authBtn').textContent = mode === 'in' ? 'Sign in' : 'Create account';
  $('sw').innerHTML = mode === 'in' ? 'No account? <a id="swLink2">Create one</a>' : 'Have an account? <a id="swLink2">Sign in</a>';
  $('swLink2').onclick = $('swLink').onclick; setMsg('');
};
$('authBtn').onclick = async () => {
  const u = $('u').value.trim().toLowerCase(), p = $('p').value;
  if (!/^[a-z0-9_]{3,20}$/.test(u)) return setMsg('Username: 3–20 letters, numbers or _');
  if (p.length < 6) return setMsg('Password must be at least 6 characters');
  setMsg('Please wait…', true);
  if (mode === 'up') {
    const { error } = await sb.auth.signUp({ email: u + DOMAIN, password: p });
    if (error) return setMsg(error.message);
    await sb.auth.signOut();
    return setMsg('Account created. You can sign in once the admin approves it.', true);
  }
  const { error } = await sb.auth.signInWithPassword({ email: u + DOMAIN, password: p });
  if (error) return setMsg('Wrong username or password');
  localStorage.setItem('cv_login_at', Date.now());
  boot();
};
$('p').addEventListener('keydown', e => e.key === 'Enter' && $('authBtn').click());
async function logout(msg){ await sb.auth.signOut(); localStorage.removeItem('cv_login_at'); showAuth(msg); }
$('out').onclick = () => logout();

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showAuth();
  const at = +localStorage.getItem('cv_login_at');
  if (!at || Date.now() - at >= SESSION_MS) return logout(at ? 'Your 4-minute session ended. Please sign in again.' : '');
  me = session.user;
  const { data } = await sb.from('profiles').select('*').eq('id', me.id).single();
  profile = data;
  if (!profile || !profile.approved) return logout('Your account is not approved (or is blocked) by the admin.');
  $('auth').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = profile.username + (profile.role === 'admin' ? ' (admin)' : '');
  const adm = profile.role === 'admin';
  $('tAll').classList.toggle('hide', !adm); $('tUsers').classList.toggle('hide', !adm);
  clearInterval(tick); tick = setInterval(clock, 1000); clock();
  show('files');
}
function clock(){
  const left = SESSION_MS - (Date.now() - +localStorage.getItem('cv_login_at'));
  if (left <= 0) return logout('Your 4-minute session ended. Please sign in again.');
  const s = Math.ceil(left / 1000);
  $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('timer').classList.toggle('low', s <= 30);
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => show(b.dataset.t));
function show(t){
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('vFiles').classList.toggle('hide', t === 'users');
  $('upBox').classList.toggle('hide', t === 'pub'); $('vUsers').classList.toggle('hide', t !== 'users');
  t === 'users' ? loadUsers() : loadFiles();
}

/* ---------- files ---------- */
async function loadFiles(){
  let q = sb.from('files').select('*').order('created_at', { ascending: false });
  if (tab === 'files') q = q.eq('owner', me.id);
  if (tab === 'pub') q = q.eq('is_public', true);
  const { data, error } = await q;
  if (error) return toast(error.message);
  files = data || [];
  if (tab === 'all' || tab === 'pub') {
    const { data: ps } = await sb.from('profiles').select('id,username');
    names = Object.fromEntries((ps || []).map(p => [p.id, p.username]));
  }
  const exts = [...new Set(files.map(f => extOf(f.name)))].sort(), cur = $('ext').value;
  $('ext').innerHTML = '<option value="">All types</option>' + exts.map(e => `<option ${e===cur?'selected':''}>${esc(e)}</option>`).join('');
  render();
}
function render(){
  const t = $('q').value.toLowerCase(), e = $('ext').value;
  const list = files.filter(f => f.name.toLowerCase().includes(t) && (!e || extOf(f.name) === e));
  const canDl = profile.role === 'admin' || profile.can_download;
  $('fileList').innerHTML = list.length ? list.map(f => `
    <div class="row">
      <span class="ext mono">${esc(extOf(f.name))}</span>
      <div class="fn"><div class="mono">${esc(f.name)}</div>
        <div class="meta">${size(f.size)} · ${new Date(f.created_at).toLocaleString()} · ${f.is_public ? 'public' : 'private'}${tab!=='files' ? ' · by ' + esc(names[f.owner] || '?') : ''}</div></div>
      <div class="actions">
        ${canDl ? `<button class="btn sm" data-dl="${f.id}">Download</button>` : '<span class="pill r">Download blocked</span>'}
        ${(f.owner === me.id || profile.role === 'admin') ? `<button class="btn ghost sm" data-pb="${f.id}">${f.is_public ? 'Make private' : 'Make public'}</button>
        <button class="btn danger sm" data-rm="${f.id}">Delete</button>` : ''}
      </div>
    </div>`).join('') : '<div class="empty">No files yet. Upload your first one above.</div>';
}
$('q').oninput = render; $('ext').onchange = render;
$('fileList').onclick = async e => {
  const dl = e.target.dataset.dl, rm = e.target.dataset.rm, pb = e.target.dataset.pb;
  if (pb) {
    const f = files.find(x => x.id === pb);
    const { error } = await sb.from('files').update({ is_public: !f.is_public }).eq('id', pb);
    error ? toast(error.message) : (toast(f.is_public ? 'Now private' : 'Now public'), loadFiles());
    return;
  }
  if (dl) {
    const f = files.find(x => x.id === dl);
    const { data, error } = await sb.storage.from('files').createSignedUrl(f.path, 60, { download: f.name });
    if (error) return toast('Download not allowed for your account');
    location.href = data.signedUrl;
  }
  if (rm && confirm('Delete this file?')) {
    const f = files.find(x => x.id === rm);
    await sb.storage.from('files').remove([f.path]);
    await sb.from('files').delete().eq('id', rm);
    toast('Deleted'); loadFiles();
  }
};
async function upload(list){
  for (const f of list) {
    toast('Uploading ' + f.name + '…');
    const path = me.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g, '_');
    const up = await sb.storage.from('files').upload(path, f);
    if (up.error) { toast('Upload failed: ' + up.error.message); continue; }
    await sb.from('files').insert({ owner: me.id, name: f.name, path, size: f.size, is_public: $('pubChk').checked });
  }
  toast('Upload complete'); if (tab === 'users') show('files'); else loadFiles();
}
const drop = $('drop');
drop.onclick = () => $('pick').click();
$('pick').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
['dragenter','dragover'].forEach(v => drop.addEventListener(v, e => { e.preventDefault(); drop.classList.add('over') }));
['dragleave','drop'].forEach(v => drop.addEventListener(v, e => { e.preventDefault(); drop.classList.remove('over') }));
drop.addEventListener('drop', e => upload([...e.dataTransfer.files]));

/* ---------- admin: users ---------- */
async function loadUsers(){
  const { data, error } = await sb.from('profiles').select('*').order('created_at');
  if (error) return toast(error.message);
  $('userList').innerHTML = data.map(u => `
    <div class="row">
      <div class="fn"><div><b>${esc(u.username)}</b> ${u.role==='admin'?'<span class="pill g">admin</span>':''}</div>
        <div class="meta">Joined ${new Date(u.created_at).toLocaleDateString()}</div></div>
      <span class="pill ${u.approved?'g':'r'}">${u.approved?'Can log in':'Blocked / pending'}</span>
      <span class="pill ${u.can_download?'g':'r'}">${u.can_download?'Can download':'No download'}</span>
      ${u.role==='admin' ? '' : `<div class="actions">
        <button class="btn ghost sm" data-ap="${u.id}" data-v="${!u.approved}">${u.approved?'Block login':'Allow login'}</button>
        <button class="btn ghost sm" data-dw="${u.id}" data-v="${!u.can_download}">${u.can_download?'Block download':'Allow download'}</button></div>`}
    </div>`).join('');
}
$('userList').onclick = async e => {
  const d = e.target.dataset, id = d.ap || d.dw; if (!id) return;
  const patch = d.ap ? { approved: d.v === 'true' } : { can_download: d.v === 'true' };
  const { error } = await sb.from('profiles').update(patch).eq('id', id);
  error ? toast(error.message) : (toast('Saved'), loadUsers());
};

/* ---------- start ---------- */
if (initError) { showAuth(initError); $('authBtn').disabled = true; }
else boot().catch(e => showAuth('Error: ' + e.message));
</script>
</body>
</html>
